# ClusterSecretStore - Vault Backend Configuration
# Deploy to DOWNSTREAM cluster after running vault-setup.sh
# kubectl apply -f clustersecretstore.yaml

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  namespace: external-secrets-system
spec:
  provider:
    vault:
      # Vault server address
      # If within same cluster: http://vault.vault.svc.cluster.local:8200
      # If cross-cluster via ingress: http://vault.yourdomain.local:8200
      # If cross-cluster via LoadBalancer: http://<external-ip>:8200
      server: "http://vault.vault.svc.cluster.local:8200"

      # Path to K/V v2 secrets engine
      path: "secret"
      version: "v2"

      # AppRole authentication
      auth:
        appRole:
          # Reference to the secret containing role-id and secret-id
          # This secret is created by vault-setup.sh
          secretRef:
            name: vault-approle-creds
            namespace: external-secrets-system

          # Keys in the secret that hold the credentials
          roleId: "role-id"
          secretId: "secret-id"

---
# Example: If you want different access patterns, create multiple SecretStores:

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend-namespaced
  namespace: my-app
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        appRole:
          secretRef:
            name: vault-approle-creds
            namespace: external-secrets-system
          roleId: "role-id"
          secretId: "secret-id"

---
# Test ExternalSecret - verify the setup works
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vault-test
  namespace: external-secrets-system
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  target:
    name: vault-test-secret
    creationPolicy: Owner

  data:
    - secretKey: test-value
      remoteRef:
        key: downstream/test
        property: value

# Before applying this ExternalSecret, create the test secret in Vault:
# kubectl -n vault exec vault-0 -- vault kv put secret/downstream/test value="test-successful"
#
# Then verify the sync:
# kubectl get externalsecret vault-test
# kubectl get secret vault-test-secret
