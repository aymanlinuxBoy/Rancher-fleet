# ExternalSecret Examples
# These show how to sync different types of secrets from Vault to K8s

---
# Example 1: Database Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: default
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  target:
    name: db-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app: myapp
      type: Opaque
      data:
        # Synthesize connection string from multiple fields
        connection-string: "postgresql://{{ .username }}:{{ .password }}@postgres.default:5432/mydb"

  data:
    - secretKey: username
      remoteRef:
        key: downstream/db-creds
        property: username

    - secretKey: password
      remoteRef:
        key: downstream/db-creds
        property: password

  refreshInterval: 1h

---
# Example 2: API Keys
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-credentials
  namespace: default
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  target:
    name: api-secret
    creationPolicy: Owner

  data:
    - secretKey: api-key
      remoteRef:
        key: downstream/api/keys
        property: primary-key

    - secretKey: api-secret
      remoteRef:
        key: downstream/api/keys
        property: secret

  refreshInterval: 6h

---
# Example 3: Docker Registry Credentials (creates imagePullSecret)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: docker-registry
  namespace: default
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  target:
    name: docker-registry-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockercfg
      data:
        .dockercfg: |
          {
            "registry.example.com": {
              "username": "{{ .registry_username }}",
              "password": "{{ .registry_password }}",
              "email": "ci@example.com",
              "auth": "{{ (printf "%s:%s" .registry_username .registry_password) | b64enc }}"
            }
          }

  data:
    - secretKey: registry_username
      remoteRef:
        key: downstream/docker-registry
        property: username

    - secretKey: registry_password
      remoteRef:
        key: downstream/docker-registry
        property: password

  refreshInterval: 12h

---
# Example 4: TLS Certificate
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tls-certificate
  namespace: default
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  target:
    name: app-tls
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .certificate }}"
        tls.key: "{{ .private_key }}"

  data:
    - secretKey: certificate
      remoteRef:
        key: downstream/certs/app-tls
        property: cert

    - secretKey: private_key
      remoteRef:
        key: downstream/certs/app-tls
        property: key

  refreshInterval: 24h

---
# Example 5: SSH Key
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ssh-key
  namespace: default
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  target:
    name: ssh-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        ssh_key: "{{ .private_key }}"
        ssh_pub_key: "{{ .public_key }}"

  data:
    - secretKey: private_key
      remoteRef:
        key: downstream/ssh/keys
        property: private

    - secretKey: public_key
      remoteRef:
        key: downstream/ssh/keys
        property: public

  refreshInterval: 24h

---
# How to populate these secrets in Vault:

# Database credentials:
# kubectl -n vault exec vault-0 -- vault kv put secret/downstream/db-creds \
#   username=dbuser \
#   password=db_secure_password_123

# API credentials:
# kubectl -n vault exec vault-0 -- vault kv put secret/downstream/api/keys \
#   primary-key=sk_live_abc123xyz \
#   secret=sk_secret_def456uvw

# Docker registry:
# kubectl -n vault exec vault-0 -- vault kv put secret/downstream/docker-registry \
#   username=dockeruser \
#   password=docker_token_789xyz

# TLS certificate:
# kubectl -n vault exec vault-0 -- vault kv put secret/downstream/certs/app-tls \
#   cert=@/path/to/cert.pem \
#   key=@/path/to/key.pem

# SSH keys:
# kubectl -n vault exec vault-0 -- vault kv put secret/downstream/ssh/keys \
#   private=@/path/to/id_rsa \
#   public=@/path/to/id_rsa.pub
