# Fluent Bit - Fleet Bundle
# Log shipping to centralized log aggregation (Loki, ELK, etc.)

apiVersion: fleet.cattle.io/v1alpha1
kind: Bundle
metadata:
  name: fluent-bit
  namespace: fleet-default
spec:
  # Deploy to all clusters
  targets:
    - clusterGroupSelector: {}

  helm:
    chart: fluent-bit
    repo: https://fluent.github.io/helm-charts
    releaseName: fluent-bit
    releaseNamespace: logging
    createNamespace: true
    values:
      image:
        repository: fluent/fluent-bit
        tag: 2.1.5

      serviceAccount:
        create: true

      rbac:
        create: true

      podSecurityPolicy:
        create: false

      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi

      # Output to Loki (requires Loki to be installed)
      config:
        outputs: |
          [OUTPUT]
              name loki
              match *
              host loki.logging
              port 3100
              labels job="fluent-bit"
              auto_kubernetes_labels on

      # Input: Kubernetes logs
        inputs: |
          [INPUT]
              name tail
              path /var/log/containers/*.log
              parser docker
              tag kube.*
              mem_buf_limit 5MB
              skip_long_lines On
              skip_empty_lines On

          [INPUT]
              name systemd
              tag host.*
              read_from_tail On

      # Filters: Enrich with Kubernetes metadata
        filters: |
          [FILTER]
              name kubernetes
              match kube.*
              kube_url https://kubernetes.default.svc:443
              kube_ca_file /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              kube_token_file /var/run/secrets/kubernetes.io/serviceaccount/token
              labels On
              annotations On

      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      # DaemonSet (runs on all nodes)
      kind: DaemonSet
